<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <title>Tommy-Assignment 1</title>
        <style>
            html {
                font-family: roboto;
                margin: 20px;
                color: black;
            }

            .c-btn {
                background-color: #b4715b;
                border-radius: 30px;
                border: 1px solid #b4715b;
                color: #ffffff;
                padding: 10px 20px;
                font-size: 18px;
                cursor: pointer;
            }

            .c-btn.c-btn-secondary {
                background-color: #fbf7f4;
                color: #a2624e;
            }

            .c-btn.c-btn-disabled {
                background-color: #f1f1f1;
                border: 1px solid #ccc;
                color: #9c9c9c;
                cursor: not-allowed;
            }

            .c-btn.c-btn-danger {
                background-color: #b8535a;
                border: 1px solid #b8535a;
                color: #ffffff;
            }
        </style>
    </head>
    <body>
        <h1>Tommy-Assignment 1</h1>
        <h2>Primary Button</h2>
        <span class="c-btn">Primary</span>
        <h2>Secondary Button</h2>
        <span class="c-btn c-btn-secondary">Secondary</span>
        <h2>Disabled Button</h2>
        <span class="c-btn c-btn-disabled">Disabled</span>
        <h2>Danger Button</h2>
        <span class="c-btn c-btn-danger">Danger</span>
    </body>
</html>
